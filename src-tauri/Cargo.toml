[package]
name = "shuriken-chat"
version = "0.1.0"
description = "Visor de escritorio sin bordes para el chat unificado de Social Stream Ninja"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-runtime = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Mismo crate que usa Tauri por dentro: lo necesitamos para activar WebRTC en WebKitGTK.
webkit2gtk = { version = "2", features = ["v2_38"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
