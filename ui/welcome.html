<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shuriken Chat</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; font-family: system-ui, sans-serif; user-select: none; }
    .card {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      border-radius: 14px; border: 1px dashed rgba(255,255,255,.35);
      background: rgba(18, 18, 24, .78); color: #eee; text-align: center; padding: 20px;
    }
    img { width: 72px; height: 72px; }
    h1 { margin: 0; font-size: 20px; }
    p { margin: 0; color: #bbb; font-size: 14px; line-height: 1.5; }
    kbd { background: #333; border-radius: 4px; padding: 1px 6px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="icon.svg" alt="" />
    <h1>Shuriken Chat</h1>
    <p>Haz <kbd>clic derecho</kbd> → <b>Configuración…</b><br />y pega la URL de tu dock de Social Stream Ninja.</p>
    <p>Arrastra para mover · Bordes para redimensionar</p>
  </div>
</body>
</html>
